<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marque Tag</title>
</head>
<body>
  <mark style="background-color: goldenrod ;">Helllo default color is yellow</mark>
<br><br><br><br>
  <marquee behavior="alternate" direction="Left" loop="100" height = "200px" style="background-color: aquamarine; align-content: center;">Hello Gautam</marquee>
  
  <marquee behavior="slide" direction="right" width="100%" height = "200px" style="background-color: aqua; align-content: center;">Hello Gautam</marquee>


 <marquee behavior="scroll" direction="up" scrollamount = "5" >Hello Gautam</marquee>
  <br><br>
  <marquee behavior="" direction="down" scrollamount="2" height = "100%" width="100vw">Hello Gautam </marquee>
  
</body>
</html>
